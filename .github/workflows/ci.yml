name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check that the version is consistent
        run: |
          version="$(grep -m 1 -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' pom.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          bash scripts/release-version.sh check "${version}"
      - name: Build, test, Javadoc, package and run the consumer test
        run: mvn -B -ntp verify
      - name: Check that tests ran and the jars exist
        run: |
          version="$(grep -m 1 -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' pom.xml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          ran="$(cat target/surefire-reports/*.txt | grep -oE 'Tests run: [0-9]+' | awk '{ n += $3 } END { print n + 0 }')"
          echo "Tests run: ${ran}"
          test "${ran}" -gt 0
          test -f "target/tungo-sdk-${version}.jar"
          test -f "target/tungo-sdk-${version}-sources.jar"
          test -f "target/tungo-sdk-${version}-javadoc.jar"
